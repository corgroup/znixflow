name: foundation-ci
on:
  pull_request:
  push:
    branches: [znixflow-development, znixflow-staging, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-disposable-password
          MYSQL_DATABASE: znixflow
          MYSQL_USER: znixflow
          MYSQL_PASSWORD: ci-disposable-password
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: local
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: znixflow
      MYSQL_USER: znixflow
      MYSQL_PASSWORD: ci-disposable-password
      REDIS_URL: redis://127.0.0.1:6379
      QUEUE_PREFIX: znixflow-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:security
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm db:status
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
